<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxograma Avançado - Engenharia de Produção EEL-USP</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --container-bg: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --border-color: #2d2d2d;
            --accent-color: #ff9800;
            --strong-color: #ff4444; /* Vermelho para Requisito Forte */
            --weak-color: #ffeb3b;   /* Amarelo para Requisito Fraco */
            --ext-color: #00e676;    /* Verde Neon para Extensão (EXT) */
            --menu-bg: #161616;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-y: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-left: 60px; 
        }

        header h1 {
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            color: #fff;
        }

        header p {
            color: var(--text-secondary);
            margin: 0;
            font-size: 0.9rem;
        }

        /* Menu Retrátil Lateral */
        .menu-toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #1a1a1a;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 110;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .menu-toggle-btn:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -310px;
            width: 290px;
            height: 100%;
            background-color: var(--menu-bg);
            border-right: 1px solid var(--border-color);
            z-index: 105;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 80px 20px 20px 20px;
            box-sizing: border-box;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
        }

        .side-menu.open {
            left: 0;
        }

        .side-menu h2 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #fff;
        }

        .menu-section {
            margin-bottom: 25px;
        }

        .menu-section h3 {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }

        .menu-option input {
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        /* Legenda de Cores */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        /* Painel do Fluxograma */
        .outer-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: calc(100vh - 170px);
            border: 1px solid var(--border-color);
            background-color: var(--container-bg);
            border-radius: 8px;
            position: relative;
        }

        .flowchart-container {
            display: flex;
            gap: 25px;
            padding: 35px;
            position: relative;
            width: max-content;
        }

        .period-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 210px;
            position: relative;
        }

        .period-header {
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 0;
            background-color: #181818;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Cards das Matérias */
        .subject-card {
            background-color: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 10px;
            font-size: 0.78rem;
            text-align: center;
            min-height: 54px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            user-select: none;
            position: relative;
            z-index: 10;
        }

        .subject-card span.code {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-family: monospace;
        }

        .subject-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.2);
            border-color: #666;
        }

        .subject-card.selected {
            border-color: var(--accent-color) !important;
            background-color: #262626;
            box-shadow: 0 0 16px rgba(255, 152, 0, 0.6) !important;
        }
        
        .subject-card.selected span.code {
            color: var(--accent-color);
        }

        /* Efeitos de Glow Neon */
        .subject-card.glow-strong {
            border-color: var(--strong-color) !important;
            box-shadow: 0 0 14px var(--strong-color);
            transform: scale(1.02);
        }

        .subject-card.glow-weak {
            border-color: var(--weak-color) !important;
            box-shadow: 0 0 14px var(--weak-color);
            transform: scale(1.02);
        }

        .subject-card.glow-ext {
            border-color: var(--ext-color) !important;
            box-shadow: 0 0 14px var(--ext-color);
            transform: scale(1.02);
        }

        /* Camada SVG de Conexões (Sobreposta) */
        .connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 20; 
        }
    </style>
</head>
<body>

    <button class="menu-toggle-btn" onclick="toggleMenu()">
        <span>☰</span> Lógica do Fluxo
    </button>

    <div class="side-menu" id="side-panel">
        <h2>Configurações de Filtro</h2>
        
        <div class="menu-section">
            <h3>Caminho Anterior</h3>
            <label class="menu-option">
                <input type="checkbox" id="ant-single" checked onchange="handleMenuLogic('ant-single')">
                Matérias anteriores (1ª camada)
            </label>
            <label class="menu-option">
                <input type="checkbox" id="ant-all" onchange="handleMenuLogic('ant-all')">
                Todas as matérias anteriores
            </label>
        </div>

        <div class="menu-section">
            <h3>Caminho Posterior</h3>
            <label class="menu-option">
                <input type="checkbox" id="post-single" checked onchange="handleMenuLogic('post-single')">

            </label>
            <label class="menu-option">
                <input type="checkbox" id="post-all" onchange="handleMenuLogic('post-all')">
                Todas as matérias posteriores
            </label>
        </div>

        <div class="menu-section">
            <h3>Extensão (EXT)</h3>
            <label class="menu-option">
                <input type="checkbox" id="show-ext" onchange="handleMenuLogic('show-ext')">

            </label>
        </div>
    </div>

    <header>

        </div>
    </div>

        let selectedSubjectId = null;

        function toggleMenu() {
            document.getElementById('side-panel').classList.toggle('open');
        }

        function handleMenuLogic(triggeredId) {
            const antSingle = document.getElementById('ant-single');
            const antAll = document.getElementById('ant-all');
            const postSingle = document.getElementById('post-single');
            const postAll = document.getElementById('post-all');

            if (triggeredId === 'ant-single' && antSingle.checked) antAll.checked = false;
            if (triggeredId === 'ant-all' && antAll.checked) antSingle.checked = false;
            if (triggeredId === 'post-single' && postSingle.checked) postAll.checked = false;
            if (triggeredId === 'post-all' && postAll.checked) postSingle.checked = false;

            refreshVisuals();
        }

        function renderFlowchart() {
            const container = document.getElementById("flowchart");
            const svg = document.getElementById("svg-canvas");
            
            container.innerHTML = '';
            container.appendChild(svg);
            clearLinesAndGlows();

            for (let i = 1; i <= 10; i++) {
                const col = document.createElement("div");
                col.className = "period-column";
                col.innerHTML = `<div class="period-header">${i}º Período</div>`;
                
                const periodSubs = curriculum.filter(s => s.period === i);
                periodSubs.forEach(sub => {
                    const card = document.createElement("div");
                    card.className = "subject-card";
                    card.id = sub.id;
                    card.innerHTML = `${sub.name} <span class="code">${sub.id}</span>`;
                    
                    card.onclick = (e) => { 
                        e.stopPropagation(); 
                        handleSubjectClick(sub.id); 
                    };
                    col.appendChild(card);
                });

                container.appendChild(col);
            }
        }

        function handleSubjectClick(id) {
            if (selectedSubjectId === id) {
                selectedSubjectId = null;
                document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('selected'));
                clearLinesAndGlows();
                refreshVisuals();
                return;
            }

            selectedSubjectId = id;
            refreshVisuals();
        }

        function refreshVisuals() {
            clearLinesAndGlows();

            // 1. Aplica o Glow Verde de Extensão se a opção estiver ligada no menu
            const showExt = document.getElementById('show-ext') && document.getElementById('show-ext').checked;
            if (showExt) {
                curriculum.filter(s => s.ext).forEach(s => {
                    const card = document.getElementById(s.id);
                    if (card) {
                        card.classList.add('glow-ext');
                    }
                });
            }

            // 2. Aplica o destaque na matéria selecionada
            document.querySelectorAll('.subject-card').forEach(c => {
                c.classList.remove('selected');
                if (c.id === selectedSubjectId) c.classList.add('selected');
            });

            // 3. Desenha as dependências se houver matéria selecionada
            if (selectedSubjectId) {
                tracePrerequisites();
                traceDependents();
            }
        }

        // ANTERIORES
        function tracePrerequisites() {
            const singleChecked = document.getElementById('ant-single').checked;
            const allChecked = document.getElementById('ant-all').checked;

            if (!singleChecked && !allChecked) return;

            if (selectedSubjectId === "LOQ4228" || selectedSubjectId === "LOQ4230") {
                const target = curriculum.find(s => s.id === selectedSubjectId);
                target.prereqs.forEach(p => {
                    const card = document.getElementById(p.id);
                    if (card) card.classList.add(p.type === "strong" ? "glow-strong" : "glow-weak");
                });
                return;
            }

            function traverse(currentId, depth, visited = new Set()) {
                if (visited.has(currentId)) return;
                visited.add(currentId);

                const target = curriculum.find(s => s.id === currentId);
                if (!target) return;

                target.prereqs.forEach(p => {
                    const color = p.type === "strong" ? 'var(--strong-color)' : 'var(--weak-color)';
                    const markerId = p.type === "strong" ? 'arrow-strong' : 'arrow-weak';

                    if (depth === 0) {
                        drawArrow(p.id, currentId, color, markerId);
                        if (allChecked) traverse(p.id, depth + 1, visited);
                    } else if (allChecked) {
                        drawArrow(p.id, currentId, color, markerId);
                        traverse(p.id, depth + 1, visited);
                    }
                });
            }

            traverse(selectedSubjectId, 0);
        }

        // POSTERIORES
        function traceDependents() {
            const singleChecked = document.getElementById('post-single').checked;
            const allChecked = document.getElementById('post-all').checked;

            if (!singleChecked && !allChecked) return;

            function traverse(currentId, depth, visited = new Set()) {
                if (visited.has(currentId)) return;
                visited.add(currentId);

                curriculum.forEach(sub => {
                    const relation = sub.prereqs.find(p => p.id === currentId);
                    if (relation) {
                        const color = relation.type === "strong" ? 'var(--strong-color)' : 'var(--weak-color)';
                        const markerId = relation.type === "strong" ? 'arrow-strong' : 'arrow-weak';

                        if (depth === 0) {
                            drawArrow(currentId, sub.id, color, markerId);
                            const card = document.getElementById(sub.id);
                            if (card) {
                                card.classList.add(relation.type === "strong" ? "glow-strong" : "glow-weak");
                            }
                            if (allChecked) traverse(sub.id, depth + 1, visited);
                        } else if (allChecked) {
                            drawArrow(currentId, sub.id, color, markerId);
                            traverse(sub.id, depth + 1, visited);
                        }
                    }
                });
            }

            traverse(selectedSubjectId, 0);
        }

        function drawArrow(fromId, toId, color, markerId) {
            const fromElem = document.getElementById(fromId);
            const toElem = document.getElementById(toId);
            const container = document.getElementById("flowchart");
            const svg = document.getElementById("svg-canvas");

            if (!fromElem || !toElem) return;

            const rectContainer = container.getBoundingClientRect();
            const rectFrom = fromElem.getBoundingClientRect();
            const rectTo = toElem.getBoundingClientRect();

            const x1 = rectFrom.right - rectContainer.left;
            const y1 = rectFrom.top - rectContainer.top + (rectFrom.height / 2);

            const x2 = rectTo.left - rectContainer.left;
            const y2 = rectTo.top - rectContainer.top + (rectTo.height / 2);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const controlOffset = Math.abs(x2 - x1) * 0.45;
            const d = `M ${x1} ${y1} C ${x1 + controlOffset} ${y1}, ${x2 - controlOffset} ${y2}, ${x2} ${y2}`;

            path.setAttribute("d", d);
            path.setAttribute("stroke", color);
            path.setAttribute("stroke-width", "2.5"); 
            path.setAttribute("fill", "none");
            path.setAttribute("marker-end", `url(#${markerId})`);
            path.setAttribute("class", "connection-line");

            svg.appendChild(path);
        }

        function clearLinesAndGlows() {
            document.querySelectorAll('.connection-line').forEach(line => line.remove());
            document.querySelectorAll('.subject-card').forEach(c => {
                c.classList.remove('glow-strong', 'glow-weak', 'glow-ext');
            });
        }

        document.getElementById('scroll-wrapper').onclick = () => {
            document.getElementById('side-panel').classList.remove('open');
            selectedSubjectId = null;
            refreshVisuals();
        };

        window.onresize = () => {
            if (selectedSubjectId) {
                refreshVisuals();
            }
        };

        renderFlowchart();
    </script>
</body>
</html>
